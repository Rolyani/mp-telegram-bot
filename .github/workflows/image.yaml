name: image

# Build on every push to main, and on a pushed v* tag.
#
# Not on pull_request: a PR build would publish an image for code that is not on main yet,
# and every tag in the registry is something Flux is allowed to pin (D8).
on:
  push:
    branches: [main]
    tags: ["v*"]

# Actions are pinned to a commit SHA, not a floating major tag: `@v7` is a moving target that
# GitHub re-points, and these jobs hold `packages: write`. Same reasoning as the digest pins on
# the base images in the Dockerfile. The trailing comment is the human-readable version, and it
# is also what Renovate reads and rewrites when it opens the bump PR (D8).

jobs:
  # The gate. Nothing reaches the registry unless this job is green.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Postgres accepts a TCP connection before it will serve queries. Without the health
        # gate the first test on a cold runner intermittently fails to connect.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # ⚠️ THE LINE THE GATE DEPENDS ON. Without TEST_DATABASE_URL the 11 TestPostgresStore
    # tests SKIP and `go test ./...` still prints ok — a green tick over an untested store.
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # the pin stays in one place

      - run: go vet ./...

      # -count=1 disables the test cache: a cached PASS from a run where the database was
      # absent would defeat the whole job.
      - run: go test -count=1 ./...

  build:
    needs: test # the gate; without this the jobs race and the image ships regardless
    runs-on: ubuntu-latest

    # The default GITHUB_TOKEN cannot write packages. Omit this and the push fails with a
    # 403 denied that reads exactly like broken credentials.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Computes the tags and the OCI labels. github.repository is Rolyani/mp-telegram-bot,
      # capital R; GHCR paths must be lowercase, and this action lowercases it for us.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Carries org.opencontainers.image.source, which is what links the GHCR package
          # back to this repo in the UI. G5 needs that same link for the chart.
          labels: ${{ steps.meta.outputs.labels }}
