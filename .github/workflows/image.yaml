name: image # display name

# On these two events run the workflow.
on:
  push:
    branches: [main] # a push to main
    tags: ["v*"] # pushing a tag starting with v

jobs:

  test: # name of the job
    runs-on: ubuntu-24.04

    # before any tests run start a postgres database. Needed for some tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

        # Extra flags to Docker create >- format into one line. Stops here until reported healthy.
        # run postgress health check
        # every 10 seconds
        # timeout after 5 seconds
        # retry 5 times
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # point the Go tests towards the DB. The TestPostgresStore tests will silently skip if this is not here.
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
    # clone the repo at the commit the action was triggered on
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Install Go. Get the version to install from the go.mod file
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

    # Run Go static analysis
      - run: go vet ./...

    # Run all of the tests with the cache disabled.
      - run: go test -count=1 ./...

  build:
    needs: test # wait for the test job to finish and pass
    runs-on: ubuntu-24.04

    # set GitHub token permissions
    permissions:
      contents: read # needed to checkout
      packages: write # needed to push to GHCR

    steps:
      # checkout the code again on the fresh VM
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # login to GHCR using the user who triggered the action and the GitHub token
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # meta exposes tags and labels as outputs
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }} #  template needed because of my GitHub username. Must be lowercase. Rolyani/mp-telegram-bot to rolyani/mp-telegram-bot
          # short SHA
          # semver-style git tag (v1.2.3)
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      # build the image from the Dockerfile
      # apply the tags and labels created in meta to the image
      # link the package to this repository.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
