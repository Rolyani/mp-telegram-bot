name: chart # display name

# on these events run the workflow
on:
  # a push to main or pull request where the files in the charts directory or .github/workflows/chart.yaml have changed
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/chart.yaml"
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/chart.yaml"

jobs:
  chart:
    runs-on: ubuntu-24.04

    # set GitHub token permissions
    permissions:
      contents: read # needed to checkout
      packages: write # needed to push to GHCR

    # variables for the job
    env:
      CHART_DIR: charts/mp-telegram-bot # where the chart lives
      REGISTRY: oci://ghcr.io/rolyani/charts # OCI namespace to push to, lowercase username

    steps:
      # clone the repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # install the Helm CLI, pinned to the same version as local linting (alpine/helm)
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      # run the linter on PR and push
      - run: helm lint "$CHART_DIR"

      # from this point only a push action takes affect
      # read the chart version
      - id: chart
        if: github.event_name == 'push'
        run: |
          version=$(helm show chart "$CHART_DIR" | awk '/^version:/ {print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # registry login logs Helm into GHCR with the credentials
      # --password-stdin keeps the password out of the commands arguments
      - if: github.event_name == 'push'
        run: echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # overwrite guard asks GHCR if the exact chart version exists. Exit if it is the same and fail the job.
      - if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          if helm show chart "$REGISTRY/mp-telegram-bot" --version "$VERSION" >/dev/null 2>&1; then
            echo "::error::chart $VERSION is already published; bump version in $CHART_DIR/Chart.yaml"
            exit 1
          fi

      # package and push
      # helm package bundles the directory into versioned archive
      # helm push upload the archive to GHCR as an OCI artefact
      - if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm package "$CHART_DIR" --destination dist
          helm push "dist/mp-telegram-bot-$VERSION.tgz" "$REGISTRY"
